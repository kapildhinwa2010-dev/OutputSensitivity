[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outputsensitivity"
version = "0.1.0"
description = "OutputSensitivity - Rank layers by output sensitivity of their singular bases"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
